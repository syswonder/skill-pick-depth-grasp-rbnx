# Description: 让宿主上的 `python3 -m pytest tests/ -q` 能跑起来。
#
# 这台宿主 /usr/bin/python3 的 pytest 是 6.2.5，但用户 site-packages 里有 anyio 4.14.2，
# 它的 pytest11 入口（anyio.pytest_plugin）import 了 pytest 7 才有的 `_pytest.scope`，
# 于是 pytest 还没开始收集测试、在加载插件时就炸了（与本包代码无关）：
#   ModuleNotFoundError: No module named '_pytest.scope'
# 这里只干一件事：不加载 anyio 那个插件。anyio 不参与本包的测试，关掉不影响任何东西。
[pytest]
addopts = -p no:anyio
